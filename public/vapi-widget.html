<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapi Widget</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6A0DAD 0%, #8B1EDB 100%);
            overflow: hidden;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 12px;
            position: relative;
        }
        
        body:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(106, 13, 173, 0.3);
        }
        
        .widget-button {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6A0DAD;
            font-weight: bold;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .widget-button:hover {
            transform: scale(1.1);
        }
        
        .pulse {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        /* Hide the default Vapi widget */
        vapi-widget {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="pulse"></div>
    <button class="widget-button" id="vapiButton">AI</button>
    
    <!-- Load Vapi SDK -->
    
    <script type="module">
        import Vapi from 'https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/index.js';
        
        let vapi = null;
        let isCallActive = false;

        // Initialize Vapi when the page loads
        window.addEventListener('load', function() {
            try {
                // Initialize Vapi with your credentials
                vapi = new Vapi('45b82946-e45a-48e4-b450-a361346d45ed');
                
                // Set up event listeners
                vapi.on('call-start', () => {
                    console.log('Call started');
                    isCallActive = true;
                    updateButtonState();
                });

                vapi.on('call-end', () => {
                    console.log('Call ended');
                    isCallActive = false;
                    updateButtonState();
                });

                vapi.on('error', (error) => {
                    console.error('Vapi error:', error);
                    isCallActive = false;
                    updateButtonState();
                });

                console.log('Vapi initialized successfully');
            } catch (error) {
                console.error('Failed to initialize Vapi:', error);
            }
        });

        // Handle button click
        document.getElementById('vapiButton').addEventListener('click', function() {
            if (!vapi) {
                console.error('Vapi not initialized');
                return;
            }

            try {
                if (isCallActive) {
                    // End the call
                    vapi.stop();
                } else {
                    // Start a call with your assistant
                    vapi.start('782931dc-51f9-4c96-9f99-a56f967264d2');
                }
            } catch (error) {
                console.error('Error toggling call:', error);
            }
        });

        function updateButtonState() {
            const button = document.getElementById('vapiButton');
            if (isCallActive) {
                button.textContent = '⏹';
                button.style.background = '#ff4444';
                button.style.color = 'white';
            } else {
                button.textContent = 'AI';
                button.style.background = 'white';
                button.style.color = '#6A0DAD';
            }
        }
    </script>
</body>
</html>
